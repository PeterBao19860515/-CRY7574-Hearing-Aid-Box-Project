<template id="organizationTemplates">
<section id="organizationFilters" class="panel organization-panel"><div class="organization-header"><div><h2>Libraries &amp; tags</h2><p class="small muted">A library is a collection. Source classification stays separate when records move.</p></div><button id="newLibrary" type="button">＋ New library</button></div><div class="filter-bar"><label class="field">Library<select id="libraryFilter"><option value="">All measurements</option></select></label><label class="field">Tag<input id="tagFilter" list="tagSuggestions" placeholder="Any tag (exact match)"></label><div class="capacity-copy">Per file: 20 MB · Up to 100 files per batch<br>Workspace: 5,000 charts / 1,000 sources · Backup ≤ 180 MiB</div></div><datalist id="tagSuggestions"></datalist><div class="bulk-bar"><span id="selectedCount">0 measurements selected</span><button id="selectPage" type="button">Select this page</button><button id="clearSelection" type="button">Clear selection</button><button id="bulkEdit" type="button" class="primary" disabled>Tag / move selected</button></div><p class="small muted">Selection is kept across pages and cleared when filters change. Bulk actions affect selected records only.</p></section>
</template>
<dialog id="libraryDialog"><form id="libraryForm"><div class="dialog-header"><h2>Create library</h2><button type="button" class="icon close">×</button></div><label class="field">Library name<input name="name" maxlength="100" required></label><label class="field">Description (optional)<textarea name="description" maxlength="500" rows="3"></textarea></label><p class="small muted">Libraries organize measurements without changing their source classification or original data.</p><p class="form-error" role="alert"></p><div class="dialog-actions"><button type="button" class="close">Cancel</button><button type="submit" class="primary">Create library</button></div></form></dialog>
<dialog id="bulkDialog"><form id="bulkForm"><div class="dialog-header"><h2>Organize selected measurements</h2><button type="button" class="icon close">×</button></div><p id="bulkScope" class="small muted"></p><label class="field">Move to library<select id="bulkLibrary"><option value="">Keep current libraries</option></select></label><label class="field">Tags (comma separated)<input id="bulkTags" list="tagSuggestions" placeholder="e.g. prototype, sample-01"></label><label class="field">Tag action<select id="bulkTagMode"><option value="add">Add tags (keep existing)</option><option value="remove">Remove these tags</option><option value="replace">Replace all tags</option></select></label><p class="small muted">Original points, source files, source hashes and existing reports are preserved.</p><p class="form-error" role="alert"></p><div class="dialog-actions"><button type="button" class="close">Cancel</button><button type="submit" class="primary">Apply to selected</button></div></form></dialog>
